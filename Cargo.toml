[package]
name = "srxformer"
version = "0.1.0"
edition = "2024"
default-run = "srxformer"

[lib]
name = "srxformer"
path = "src/lib.rs"

[[bin]]
name = "srxformer"
path = "src/main.rs"

[[bin]]
name = "generate_data"
path = "src/bin/generate_data.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

