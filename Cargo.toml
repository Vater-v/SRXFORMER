[package]
name = "srxformer"
version = "0.1.0"
edition = "2024"
default-run = "srxformer"

[lib]
name = "srxformer"
path = "src/lib.rs"

[[bin]]
name = "srxformer"
path = "src/main.rs"

[[bin]]
name = "generate_data"
path = "src/bin/generate_data.rs"

[[bin]]
name = "corpus_v2_bench"
path = "src/bin/corpus_v2_bench.rs"

[[bin]]
name = "spectral_analysis"
path = "src/bin/spectral_analysis.rs"

[[bin]]
name = "corpus_v3_bench"
path = "src/bin/corpus_v3_bench.rs"

[[bin]]
name = "prepare_chinchilla_data"
path = "src/bin/prepare_chinchilla_data.rs"

[[bin]]
name = "chinchilla_pipeline"
path = "src/bin/chinchilla_pipeline.rs"

[[bin]]
name = "chinchilla_bench"
path = "src/bin/chinchilla_bench.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

